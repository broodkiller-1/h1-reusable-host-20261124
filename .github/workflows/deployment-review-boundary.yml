name: Owned deployment reviewer boundary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protected:
    runs-on: ubuntu-latest
    environment: h1-protected-approval-20261124
    steps:
      - name: Write harmless approved marker
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          path = f'probe/{os.environ["RUN_ID"]}-deployment-approved.txt'
          body = json.dumps({'message':'Owned deployment approval boundary', 'content':base64.b64encode(b'approved owned test\n').decode(), 'branch':'main'}).encode()
          req = urllib.request.Request(f'https://api.github.com/repos/broodkiller-2/h1-reusable-host-20261124/contents/{path}', data=body, method='PUT', headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Content-Type':'application/json','User-Agent':'OwnedDeploymentApprovalProbe'})
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f'approved_marker status={response.status}')
          except urllib.error.HTTPError as error:
              print(f'approved_marker status={error.code}')
          PY
